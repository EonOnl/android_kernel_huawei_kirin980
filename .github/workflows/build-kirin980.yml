name: Build Kirin980 KernelSU Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            python3 curl unzip rsync git cpio

      - name: Download Android NDK r14b
        run: |
          curl -L -o /tmp/android-ndk-r14b.zip \
            https://dl.google.com/android/repository/android-ndk-r14b-linux-x86_64.zip
          unzip -q /tmp/android-ndk-r14b.zip -d $HOME

      - name: Prepare KernelSU
        shell: bash
        run: |
          set -euxo pipefail

          KSU_COMMIT=156b17f69d8fcdbc0d7e4e1904ecbb1d769bf6

          test -d KernelSU
          test -f KernelSU/kernel/setup.sh
          test "$(git -C KernelSU rev-parse HEAD)" = "$KSU_COMMIT"

          cp KernelSU/kernel/setup.sh /tmp/kernelsu-setup.sh

          sed -i \
            -e '/^[[:space:]]*git stash/d' \
            -e '/^[[:space:]]*git pull/d' \
            /tmp/kernelsu-setup.sh

          bash /tmp/kernelsu-setup.sh "$KSU_COMMIT"

          test -L drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export PATH="$HOME/android-ndk-r14b/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin:$PATH"

          rm -rf out include/config

          make ARCH=arm64 O=out Mate20_kirin980_ksu_defconfig
          make ARCH=arm64 O=out -j$(nproc)

      - name: Pack boot images
        run: |
          mkdir -p artifacts

          python3 tools/mkbootimg \
            --kernel out/arch/arm64/boot/Image.gz \
            --base 0x0 \
            --cmdline "loglevel=4 initcall_debug=n page_tracker=on ssbd=kernel printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=enforcing unmovable_isolate1=2:192M,3:224M,4:256M buildvariant=user" \
            --tags_offset 0x07988000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x07b88000 \
            --header_version 1 \
            --os_version 9.0.0 \
            --os_patch_level 2019-08 \
            --output artifacts/Kirin980_KSU_enforcing.img

          python3 tools/mkbootimg \
            --kernel out/arch/arm64/boot/Image.gz \
            --base 0x0 \
            --cmdline "loglevel=4 initcall_debug=n page_tracker=on ssbd=kernel printktimer=0xfff0a000,0x534,0x538 androidboot.selinux=permissive unmovable_isolate1=2:192M,3:224M,4:256M buildvariant=user" \
            --tags_offset 0x07988000 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x07b88000 \
            --header_version 1 \
            --os_version 9.0.0 \
            --os_patch_level 2019-08 \
            --output artifacts/Kirin980_KSU_permissive.img

          cp out/arch/arm64/boot/Image.gz artifacts/Image.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kirin980-kernelsu-build
          path: artifacts/*
